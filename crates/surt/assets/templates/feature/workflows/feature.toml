schema = 1
name = "feature"
description = "Specify, plan, build and ship one Feature."

[cleanup]
on_success = "clean"

[steps.spec]
kind = "agent"
agent = "spec"

[steps.approve-spec]
kind = "approval"
artifact = "spec"
rejection_artifact = "spec-rejection-reason"
needs = ["spec"]

[steps.spec-loop]
kind = "loop"
body = ["spec", "approve-spec"]
until = { step = "approve-spec", outcome = "approved" }

[steps.plan-tasks]
kind = "agent"
agent = "tasks"

[steps.approve-tasks]
kind = "approval"
artifact = "manifest"
rejection_artifact = "manifest-rejection-reason"
needs = ["plan-tasks"]

[steps.tasks-loop]
kind = "loop"
body = ["plan-tasks", "approve-tasks"]
until = { step = "approve-tasks", outcome = "approved" }
needs = ["spec-loop"]

[steps.prepare]
kind = "operation"
run = "git.create_run_branch"
needs = ["tasks-loop"]

[steps.implement]
kind = "per_item"
items = "manifest"
workflow = "task-cycle"
pass = ["spec"]
needs = ["prepare"]

[steps.snapshot]
kind = "operation"
run = "git.snapshot_run_branch"
needs = ["implement"]

[steps.ship]
kind = "agent"
agent = "shipper"
needs = ["snapshot"]

[steps.merge]
kind = "operation"
run = "git.merge_into_base"
needs = ["ship"]
