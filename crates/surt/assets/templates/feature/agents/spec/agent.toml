schema = 1
id = "spec"

[inputs.request]
format = "text"

[inputs.spec]
format = "markdown"
optional = true

[inputs.spec-rejection-reason]
format = "text"
optional = true

[outputs.spec]
format = "markdown"

[profile]
runtime = "claude-code"
model = "claude-sonnet-5-5"
effort = "high"

[profile.claude]
auth = "subscription"
permission_mode = "dontAsk"
tools = ["Read", "Glob", "Grep", "Write"]
allowed_tools = ["Read", "Glob", "Grep"]
disallowed_tools = ["mcp__*"]
