[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
surt-engine = { path = "crates/surt-engine" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.59", default-features = false }
toml = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
uuid = { version = "1", features = ["v7"] }
tempfile = "3"
tracing = "0.1"
dunce = "1"
jiff = "0.2"
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group", "job-object", "creation-flags", "kill-on-drop"] }
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }
windows = { version = "0.62", features = ["Win32_System_Console", "Win32_System_Threading"] }
anstream = "1"
anstyle = "1"
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
