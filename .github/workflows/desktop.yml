name: Desktop

on:
  push:
    branches: [main, master]
    paths:
      - apps/desktop/**
      - crates/surt-engine/**
      - rust-toolchain.toml
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - apps/desktop/**
      - crates/surt-engine/**
      - rust-toolchain.toml
      - .github/workflows/desktop.yml

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    shell: bash
    working-directory: apps/desktop

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev

      - name: Install pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install
        run: npm ci

      - name: Frontend tests with coverage above 90%
        run: npm run coverage

      - name: Build frontend
        run: npm run build

      - name: Format
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: apps/desktop/src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features test-support -- -D warnings

      - name: Test
        working-directory: apps/desktop/src-tauri
        run: cargo test --features test-support
